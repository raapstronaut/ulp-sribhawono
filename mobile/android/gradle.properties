# Dibatasi agar build tidak memaksa Windows membesarkan pagefile di laptop RAM 16 GB.
# Heap dump saat OOM dimatikan karena bisa menulis file sebesar heap ke disk.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m
kotlin.daemon.jvmargs=-Xmx1G
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
